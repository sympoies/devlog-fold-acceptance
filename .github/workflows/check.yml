name: Devlog validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  devlog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned devlog
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/sympoies/nils-cli/releases/download/v1.31.14/nils-cli-v1.31.14-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/nils.tar.gz"
          printf '%s  %s\n' facda9a4af8980df8b929af41e41e5bd4d9f34c0134599ca564d416e55a3fdad "$RUNNER_TEMP/nils.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/nils"
          tar -xzf "$RUNNER_TEMP/nils.tar.gz" -C "$RUNNER_TEMP/nils"
          printf '%s\n' "$RUNNER_TEMP/nils/nils-cli-v1.31.14-x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - name: Check fragments against the fetched default branch
        run: devlog check --base origin/main
