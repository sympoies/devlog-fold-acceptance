name: App permission probe
on: pull_request
permissions:
  contents: read
jobs:
  permission-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mint repository-scoped installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Verify effective repository permission
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          # Installation-token repository collaborator booleans do not prove
          # the token grant. An unreferenced blob exercises Contents: write
          # without changing a branch, commit, workflow or repository file.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" \
            -f content='Development log permission probe' -f encoding=utf-8 \
            --jq '{blob_write: (.sha | length == 40)}' > permission.json
          cat permission.json
          test "$(jq -r .blob_write permission.json)" = true
