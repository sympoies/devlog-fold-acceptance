name: Scheduled devlog fold
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  fold:
    uses: sympoies/agent-runtime-kit/.github/workflows/devlog-fold.yml@944cdb74dd3534ebbf6a7a5d3bae510a8808ac92
    with:
      log-dir: docs/devlog
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
