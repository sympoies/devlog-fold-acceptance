name: Scheduled devlog fold
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  fold:
    # Pin the merged implementation so it remains reachable after branch cleanup.
    uses: sympoies/agent-runtime-kit/.github/workflows/devlog-fold.yml@8174ef35cc8dbd38b0e426921b09e99226b3d9fc # merged in upstream PR #221
    with:
      log-dir: docs/devlog
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
